kind = "web"
previewPath = "/"
title = "Simple Calendar"
description = "A lightweight calendar for viewing months, adding events, and keeping a simple schedule in one calm, easy-to-use place."
version = "1.0.0"
id = "artifacts/simple-calendar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21142

[services.development]
run = "pnpm --filter @workspace/simple-calendar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simple-calendar", "run", "build" ]
serve = "static"
publicDir = "artifacts/simple-calendar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21142"
BASE_PATH = "/"
